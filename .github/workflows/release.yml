name: Release

# 推送形如 v* 的 tag（例如 v1.6.9）时，自动为 Windows / macOS / Linux 构建并发布到 Releases。
# 也可在 GitHub 网页上手动触发（workflow_dispatch）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 版本号一致性门禁：workspace / tauri.conf.json / ui/package.json / tag 四者必须相同。
  # 不一致会导致客户端反复提示同一个更新，或永远检测不到更新。
  version-check:
    name: Version check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: 校验四处版本号一致
        run: |
          WS=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          TC=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed 's/.*"\([0-9][^"]*\)".*/\1/')
          PKG=$(grep -m1 '"version"' ui/package.json | sed 's/.*"\([0-9][^"]*\)".*/\1/')
          echo "workspace=$WS tauri=$TC package=$PKG ref=$GITHUB_REF"
          if [ "$WS" != "$TC" ] || [ "$WS" != "$PKG" ]; then
            echo "::error::三处版本号不一致：workspace=$WS tauri=$TC package=$PKG"
            exit 1
          fi
          # 仅 tag 触发时要求与 tag 一致；workflow_dispatch 手动触发用分支名，不做此校验
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$WS" != "$TAG" ]; then
              echo "::error::tag 与版本号不一致：workspace=$WS tag=$TAG"
              exit 1
            fi
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            # Windows 分架构构建：在一个 runner 上顺序产出 x86_64 与 arm64 两个独立 exe
            args: ''
          - platform: 'macos-latest'
            # macOS 分架构构建：在一个 runner 上顺序产出 x86_64 与 aarch64 两个独立 dmg
            args: ''
          - platform: 'ubuntu-22.04'
            # 跳过 rpm（CI 镜像缺 rpmbuild），保留 deb 与 AppImage
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # macOS 签名证书可用性检测：仅当 APPLE_CERTIFICATE 能解码为有效 PKCS#12（且密码匹配）
      # 时才启用代码签名/公证；缺失或格式错误时降级为未签名构建（对应应用内 Gatekeeper 指引），
      # 避免「Secret 非空但内容无效」导致 security import 失败、整个 macOS 构建中断。
      - name: 检测 macOS 签名证书是否可用
        id: signing
        if: matrix.platform == 'macos-latest'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          enabled=false
          if [ -z "$CERT" ]; then
            echo "::warning::未配置 APPLE_CERTIFICATE，macOS 以未签名方式构建（首次打开需右键→打开，或按应用内 Gatekeeper 指引）。"
          elif printf '%s' "$CERT" | base64 -D > /tmp/watt-cert.p12 2>/dev/null \
               && openssl pkcs12 -in /tmp/watt-cert.p12 -passin "pass:$CERT_PW" -noout 2>/dev/null; then
            enabled=true
            echo "检测到有效的 Apple 签名证书，启用代码签名与公证。"
          else
            echo "::warning::APPLE_CERTIFICATE 无法解码为有效 PKCS#12（或密码不匹配），macOS 改用未签名构建。请检查仓库 Secrets。"
          fi
          rm -f /tmp/watt-cert.p12
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # 与本地工具链一致：ui/pnpm-workspace.yaml 仅含 allowBuilds 配置（无 packages 字段），
          # pnpm 9 会报 "packages field missing or empty"，pnpm 10+ 支持 config-only workspace 文件
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # 分架构构建需要安装对应的交叉编译 target：
          #  - macOS：x86_64 / aarch64
          #  - Windows：额外安装 arm64（x86_64 为默认 target，无需单独列出）
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.platform == 'windows-latest' && 'aarch64-pc-windows-msvc' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --dir ui --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir ui build

      - name: Build and publish (Tauri) - Linux
        if: matrix.platform == 'ubuntu-22.04'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包 minisign 签名（缺失则不会产出 *.sig 与 latest.json，客户端无法更新）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: 'src-tauri'
          tagName: '${{ github.ref_name }}'
          releaseName: 'Watt Toolkit ${{ github.ref_name }}'
          releaseBody: |
            ## Watt Toolkit ${{ github.ref_name }}

            自动构建的跨平台桌面客户端：

            - **Windows**：`*.exe` 安装包（NSIS）× 2（分别提供 x86_64 与 arm64 两个独立安装包）
            - **macOS**：`*.dmg` × 2（分别提供 Intel / x86_64 与 Apple Silicon / aarch64 两个独立安装包）
            - **Linux**：`*.deb` 与 `*.AppImage`

            > 注：macOS 未签名版本首次打开时，请在「访达」中右键点击应用 → 打开，以绕过 Gatekeeper 拦截。
          releaseDraft: false
          prerelease: false
          args: '${{ matrix.args }} --config ${{ github.workspace }}/src-tauri/tauri.conf.ci.json'

      - name: Build and publish (Tauri) - Windows x86_64
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包 minisign 签名（缺失则不会产出 *.sig 与 latest.json，客户端无法更新）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: 'src-tauri'
          tagName: '${{ github.ref_name }}'
          releaseName: 'Watt Toolkit ${{ github.ref_name }}'
          releaseBody: |
            ## Watt Toolkit ${{ github.ref_name }}

            自动构建的跨平台桌面客户端：

            - **Windows**：`*.exe` 安装包（NSIS）× 2（分别提供 x86_64 与 arm64 两个独立安装包）
            - **macOS**：`*.dmg` × 2（分别提供 Intel / x86_64 与 Apple Silicon / aarch64 两个独立安装包）
            - **Linux**：`*.deb` 与 `*.AppImage`

            > 注：macOS 未签名版本首次打开时，请在「访达」中右键点击应用 → 打开，以绕过 Gatekeeper 拦截。
          releaseDraft: false
          prerelease: false
          args: '--bundles nsis --config ${{ github.workspace }}/src-tauri/tauri.conf.ci.json'

      - name: Build and publish (Tauri) - Windows arm64
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包 minisign 签名（缺失则不会产出 *.sig 与 latest.json，客户端无法更新）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: 'src-tauri'
          tagName: '${{ github.ref_name }}'
          releaseName: 'Watt Toolkit ${{ github.ref_name }}'
          releaseBody: |
            ## Watt Toolkit ${{ github.ref_name }}

            自动构建的跨平台桌面客户端：

            - **Windows**：`*.exe` 安装包（NSIS）× 2（分别提供 x86_64 与 arm64 两个独立安装包）
            - **macOS**：`*.dmg` × 2（分别提供 Intel / x86_64 与 Apple Silicon / aarch64 两个独立安装包）
            - **Linux**：`*.deb` 与 `*.AppImage`

            > 注：macOS 未签名版本首次打开时，请在「访达」中右键点击应用 → 打开，以绕过 Gatekeeper 拦截。
          releaseDraft: false
          prerelease: false
          args: '--bundles nsis --target aarch64-pc-windows-msvc --config ${{ github.workspace }}/src-tauri/tauri.conf.ci.json'

      - name: Build and publish (Tauri) - macOS x86_64 (Intel)
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 代码签名 + 公证（与更新包的 minisign 签名是两套独立机制）。
          # 仅当上方 signing 检测确认证书有效时才传入；否则为空 → action 跳过签名，未签名构建。
          APPLE_CERTIFICATE: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          KEYCHAIN_PASSWORD: ${{ steps.signing.outputs.enabled == 'true' && secrets.KEYCHAIN_PASSWORD || '' }}
          APPLE_ID: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_TEAM_ID || '' }}
        with:
          projectPath: 'src-tauri'
          tagName: '${{ github.ref_name }}'
          releaseName: 'Watt Toolkit ${{ github.ref_name }}'
          releaseBody: |
            ## Watt Toolkit ${{ github.ref_name }}

            自动构建的跨平台桌面客户端：

            - **Windows**：`*.exe` 安装包（NSIS）× 2（分别提供 x86_64 与 arm64 两个独立安装包）
            - **macOS**：`*.dmg` × 2（分别提供 Intel / x86_64 与 Apple Silicon / aarch64 两个独立安装包）
            - **Linux**：`*.deb` 与 `*.AppImage`

            > 注：macOS 未签名版本首次打开时，请在「访达」中右键点击应用 → 打开，以绕过 Gatekeeper 拦截。
          releaseDraft: false
          prerelease: false
          args: '--bundles dmg --target x86_64-apple-darwin --config ${{ github.workspace }}/src-tauri/tauri.conf.ci.json'

      - name: Build and publish (Tauri) - macOS aarch64 (Apple Silicon)
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 代码签名 + 公证（与更新包的 minisign 签名是两套独立机制）。
          # 仅当上方 signing 检测确认证书有效时才传入；否则为空 → action 跳过签名，未签名构建。
          APPLE_CERTIFICATE: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          KEYCHAIN_PASSWORD: ${{ steps.signing.outputs.enabled == 'true' && secrets.KEYCHAIN_PASSWORD || '' }}
          APPLE_ID: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_TEAM_ID || '' }}
        with:
          projectPath: 'src-tauri'
          tagName: '${{ github.ref_name }}'
          releaseName: 'Watt Toolkit ${{ github.ref_name }}'
          releaseBody: |
            ## Watt Toolkit ${{ github.ref_name }}

            自动构建的跨平台桌面客户端：

            - **Windows**：`*.exe` 安装包（NSIS）× 2（分别提供 x86_64 与 arm64 两个独立安装包）
            - **macOS**：`*.dmg` × 2（分别提供 Intel / x86_64 与 Apple Silicon / aarch64 两个独立安装包）
            - **Linux**：`*.deb` 与 `*.AppImage`

            > 注：macOS 未签名版本首次打开时，请在「访达」中右键点击应用 → 打开，以绕过 Gatekeeper 拦截。
          releaseDraft: false
          prerelease: false
          args: '--bundles dmg --target aarch64-apple-darwin --config ${{ github.workspace }}/src-tauri/tauri.conf.ci.json'
