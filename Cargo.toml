[workspace]
resolver = "2"
members = [
    "crates/watt-core",
    "crates/watt-cert",
    "crates/watt-hosts",
    "crates/watt-script",
    "crates/watt-dns",
    "crates/watt-config",
    "crates/watt-cloud",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/WattToolkit/WattToolkit"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
httparse = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
x509-parser = "0.16"
hickory-resolver = { version = "0.24", features = ["tokio", "dns-over-https-rustls", "dns-over-rustls"] }
flate2 = "1"
brotli = "7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
bytes = "1"
base64 = "0.22"
urlencoding = "2"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rquickjs = "0.12"

watt-core = { path = "crates/watt-core" }
watt-cert = { path = "crates/watt-cert" }
watt-hosts = { path = "crates/watt-hosts" }
watt-script = { path = "crates/watt-script" }
watt-dns = { path = "crates/watt-dns" }
watt-config = { path = "crates/watt-config" }
watt-cloud = { path = "crates/watt-cloud" }

[profile.release]
lto = true
codegen-units = 1
strip = true
