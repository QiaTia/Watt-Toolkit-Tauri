[package]
name = "watt-toolkit-app"
# 继承 workspace 版本：此前硬编码导致 workspace 升到 0.4.1 时这里仍是 0.4.0
version.workspace = true
description = "Watt Toolkit（网络加速服务 Tauri 版）"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/WattToolkit/WattToolkit"
default-run = "watt-toolkit-app"

[lib]
name = "watt_toolkit_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 二进制内嵌 requireAdministrator 清单（写 hosts），测试二进制无法在普通终端执行；
# 单元/集成测试都在 lib 与各 crate，bin 不参与 cargo test。
[[bin]]
name = "watt-toolkit-app"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }

watt-core = { workspace = true }
watt-cert = { workspace = true }
watt-hosts = { workspace = true }
watt-dns = { workspace = true }
watt-config = { workspace = true }
watt-cloud = { workspace = true }
# rustls crypto provider 需手动安装（全局唯一入口，见 lib.rs run()）
rustls = { workspace = true }
tauri-plugin-single-instance = "2.5.4"

[features]
default = []
