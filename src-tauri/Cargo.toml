[package]
name = "watt-toolkit-app"
version = "0.1.0"
description = "Watt Toolkit（网络加速服务 Tauri 版）"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/WattToolkit/WattToolkit"
default-run = "watt-toolkit-app"

[lib]
name = "watt_toolkit_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }

watt-core = { workspace = true }
watt-cert = { workspace = true }
watt-hosts = { workspace = true }
watt-dns = { workspace = true }
watt-config = { workspace = true }
watt-cloud = { workspace = true }
# rustls crypto provider 需手动安装（全局唯一入口，见 lib.rs run()）
rustls = { workspace = true }

[features]
default = []
